<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVault</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading" class="screen">
        <div class="loading-spinner"></div>
        <p>Loading SecureVault...</p>
    </div>

    <!-- Locked State -->
    <div id="locked" class="screen" style="display: none;">
        <div class="header">
            <h1>🔐 SecureVault</h1>
            <p class="subtitle">Secure Password Manager</p>
        </div>

        <div class="auth-container">
            <!-- Master Password Login -->
            <div id="masterLogin" class="auth-section">
                <div class="input-group">
                    <label for="masterPassword">Master Password</label>
                    <input type="password" id="masterPassword" placeholder="Enter master password" class="input-field">
                    <button type="button" id="togglePassword" class="toggle-btn">👁️</button>
                </div>
                <div class="button-group">
                    <button id="unlockBtn" class="btn btn-primary">Unlock Vault</button>
                    <button id="showCreateVault" class="btn btn-secondary">Create New Vault</button>
                </div>
            </div>

            <!-- PIN Login (shown after master password is used once in session) -->
            <div id="pinLogin" class="auth-section" style="display: none;">
                <div class="input-group">
                    <label for="pinPassword">Quick PIN</label>
                    <input type="password" id="pinPassword" placeholder="Enter 4-6 digit PIN" class="input-field" maxlength="6">
                </div>
                <div class="button-group">
                    <button id="pinUnlockBtn" class="btn btn-primary">Quick Unlock</button>
                    <button id="useMasterPassword" class="btn btn-link">Use Master Password Instead</button>
                </div>
            </div>

            <!-- Create Vault -->
            <div id="createVault" class="auth-section" style="display: none;">
                <h3>Create New Vault</h3>
                <div class="input-group">
                    <label for="newMasterPassword">Master Password</label>
                    <input type="password" id="newMasterPassword" placeholder="Choose a strong master password" class="input-field">
                </div>
                <div class="input-group">
                    <label for="confirmMasterPassword">Confirm Password</label>
                    <input type="password" id="confirmMasterPassword" placeholder="Confirm master password" class="input-field">
                </div>
                <div class="input-group">
                    <label for="setupPin">Setup PIN (4-6 digits)</label>
                    <input type="password" id="setupPin" placeholder="Choose a PIN for quick access" class="input-field" maxlength="6">
                </div>
                <div class="password-strength" id="passwordStrength"></div>
                <div class="button-group">
                    <button id="createVaultBtn" class="btn btn-primary">Create Vault</button>
                    <button id="cancelCreate" class="btn btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Unlocked State -->
    <div id="unlocked" class="screen" style="display: none;">
        <div class="header">
            <div class="header-left">
                <h2>🔓 SecureVault</h2>
                <span id="currentSite" class="current-site"></span>
            </div>
            <div class="header-right">
                <button id="settingsBtn" class="icon-btn" title="Settings">⚙️</button>
                <button id="lockBtn" class="icon-btn" title="Lock Vault">🔒</button>
            </div>
        </div>

        <!-- Search and Filter -->
        <div class="search-container">
            <input type="text" id="searchEntries" placeholder="Search passwords..." class="search-input">
            <button id="addEntryBtn" class="btn btn-primary btn-add">+ Add Entry</button>
        </div>

        <!-- Current Site Matches -->
        <div id="currentSiteSection" class="section" style="display: none;">
            <h3 class="section-title">🌐 Matches for Current Site</h3>
            <div id="currentSiteEntries" class="entries-container"></div>
        </div>

        <!-- All Entries -->
        <div class="section">
            <h3 class="section-title">📝 All Passwords</h3>
            <div id="entries" class="entries-container">
                <div class="empty-state">
                    <p>No passwords saved yet</p>
                    <button class="btn btn-primary">Add Your First Password</button>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <button id="generatePasswordBtn" class="btn btn-outline">🎲 Generate Password</button>
            <button id="exportBtn" class="btn btn-outline">💾 Export Vault</button>
        </div>
    </div>

    <!-- Add/Edit Entry Modal -->
    <div id="entryModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add New Entry</h3>
                <button id="closeModal" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label for="entryName">Website/Service Name</label>
                    <input type="text" id="entryName" placeholder="e.g., Gmail, Facebook" class="input-field">
                </div>
                <div class="input-group">
                    <label for="entryUrl">Website URL</label>
                    <input type="url" id="entryUrl" placeholder="https://example.com" class="input-field">
                    <button type="button" id="detectUrl" class="btn btn-link">Use Current Tab</button>
                </div>
                <div class="input-group">
                    <label for="entryUser">Username/Email</label>
                    <input type="text" id="entryUser" placeholder="your@email.com" class="input-field">
                </div>
                <div class="input-group">
                    <label for="entryPass">Password</label>
                    <div class="password-input-container">
                        <input type="password" id="entryPass" placeholder="Password" class="input-field">
                        <button type="button" id="toggleEntryPassword" class="toggle-btn">👁️</button>
                        <button type="button" id="generateBtn" class="btn btn-secondary btn-generate">Generate</button>
                    </div>
                    <div class="password-strength" id="entryPasswordStrength"></div>
                </div>
                <div class="input-group">
                    <label for="entryNotes">Notes (Optional)</label>
                    <textarea id="entryNotes" placeholder="Additional notes..." class="input-field textarea"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button id="saveBtn" class="btn btn-primary">Save Entry</button>
                <button id="cancelBtn" class="btn btn-secondary">Cancel</button>
                <button id="deleteBtn" class="btn btn-danger" style="display: none;">Delete</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Settings</h3>
                <button id="closeSettings" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label>Auto-lock timeout</label>
                    <select id="lockTimeout" class="input-field">
                        <option value="60">1 minute</option>
                        <option value="300">5 minutes</option>
                        <option value="900">15 minutes</option>
                        <option value="1800">30 minutes</option>
                        <option value="0">Never</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>
                        <input type="checkbox" id="autoFillEnabled" checked>
                        Enable auto-fill suggestions
                    </label>
                </div>
                <div class="setting-group">
                    <label>
                        <input type="checkbox" id="showPasswordStrength" checked>
                        Show password strength indicators
                    </label>
                </div>
                <div class="setting-group">
                    <label>Change PIN</label>
                    <input type="password" id="newPin" placeholder="New 4-6 digit PIN" class="input-field" maxlength="6">
                    <button id="changePinBtn" class="btn btn-secondary">Change PIN</button>
                </div>
            </div>
            <div class="modal-footer">
                <button id="saveSettings" class="btn btn-primary">Save Settings</button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast" class="toast" style="display: none;">
        <span id="toastMessage"></span>
        <button id="toastClose">&times;</button>
    </div>

    <!-- Scripts -->
    <script src="crypto.js"></script>
    <script src="popup.js"></script>
</body>
</html>
